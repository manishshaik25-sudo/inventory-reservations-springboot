services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reservations
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: localdev
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -plocaldev"]
      interval: 5s
      timeout: 5s
      retries: 20
